# dsh-roundtable bundle patch: the three-plugin insert applied as ONE layer
# over the profile root. This file is (a) the "cordis 标记" that community
# marketplaces use to detect this repo as a DSH cordis plugin, and (b) the
# `dsh.bundle.patch` target if the repo is later published as a single
# installable bundle.
#
# Entry ids are namespaced: a same-id row in a later bundle layer REPLACES the
# earlier one and the loser disappears with no error. `id: roundtable` is
# already taken by 9931666/dsh-plugin-roundtable, so an unprefixed id made the
# two plugins mutually exclusive — whichever bundle sat later in
# `dsh.profile.bundles` silently won. Keep the `neomei-` prefix.
#
# Targets DSH 0.2.0-rc.2.

- insert:
    - id: neomei-roundtable
      name: '@neomei/dsh-roundtable'
      config:
        provider: spawn

    - id: neomei-tool-roundtable
      name: '@neomei/dsh-tool-roundtable'

    - id: neomei-ui-roundtable
      name: '@neomei/dsh-client-ui-roundtable'
